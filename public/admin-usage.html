<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1f27" media="(prefers-color-scheme: dark)">
<title>API 사용량 · 나만의 여행경로</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2430; --muted:#6b7280; --line:#e5e7eb; --accent:#ff7a00; --danger:#dc2626; --ok:#15803d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b1f27; --text:#e8eaed; --muted:#9aa3b2; --line:#2c323d; --accent:#ff8f26; --danger:#f87171; --ok:#4ade80; }
  }
  * { box-sizing:border-box; }
  html { background:var(--card); }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:17px; flex:1; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  a.btn, button { padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font-size:13px; cursor:pointer; text-decoration:none; }
  button.ok { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--danger); }
  h2 { font-size:14px; margin:22px 0 8px; color:var(--muted); font-weight:600; }
  .list { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .row:last-child { border-bottom:none; }
  .who { flex:1; min-width:180px; word-break:break-all; }
  .who small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .acts { display:flex; gap:6px; }
  .tag { font-size:11px; padding:2px 7px; border-radius:20px; border:1px solid var(--line); color:var(--muted); }
  .empty { padding:18px 14px; color:var(--muted); font-size:13px; }
  #msg { margin-top:12px; font-size:13px; color:var(--danger); }
  .h2row { display:flex; align-items:center; gap:10px; }
  .h2row h2 { flex:1; }
  .h2row small { font-weight:400; color:var(--muted); }
  .note { font-size:12px; color:var(--muted); line-height:1.6; margin:6px 0 12px; }
  .note a { color:var(--accent); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .card .lb { font-size:12px; color:var(--muted); }
  .card .big { font-size:22px; font-weight:700; margin:2px 0; }
  .card .sub { font-size:12px; color:var(--muted); }
  .bar { height:6px; border-radius:3px; background:var(--line); margin-top:8px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .bar.warn i { background:#e8a317; }
  .bar.over i { background:var(--danger); }
  .chart { display:flex; align-items:flex-end; gap:4px; height:110px; padding:10px 12px 0; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-top:10px; }
  .chart .col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; min-width:0; }
  .chart .col b { width:100%; background:var(--accent); border-radius:4px 4px 0 0; min-height:2px; }
  .chart .col span { font-size:10px; color:var(--muted); margin-top:3px; white-space:nowrap; }
  .chart .col em { font-style:normal; font-size:10px; color:var(--text); }
  .brk { font-size:12px; color:var(--muted); margin-top:3px; }
  .tot { font-weight:700; white-space:nowrap; }
</style>
</head>
<body>
<header>
  <h1>API 사용량</h1>
  <a class="btn" href="/admin">회원 관리</a>
  <a class="btn" href="/">여행경로로 돌아가기</a>
  <button id="logout">로그아웃</button>
</header>
<main>
  <div id="msg"></div>
  <div class="h2row"><h2>구글 API 사용량 <small id="usageMonth"></small></h2><button id="refreshUsage">새로고침</button></div>
  <p class="note">앱이 구글 지도로 보낸 요청 수를 <b>앱이 직접 센 추정치</b>입니다(날짜는 구글 과금 기준인 미국 태평양시). 검색창에 글자를 입력할 때마다 나가는 자동완성 요청은 셀 수 없어 “검색 후 장소 선택” 횟수로 대신하며, 무료 한도 막대는 대략적인 참고값입니다. 실제 청구 금액은 <a href="https://console.cloud.google.com/billing" target="_blank" rel="noopener">Google Cloud 결제</a>와 <a href="https://console.cloud.google.com/google/maps-apis/metrics" target="_blank" rel="noopener">Maps Platform 측정항목</a>에서 확인하세요. 최신 요금은 <a href="https://developers.google.com/maps/billing-and-pricing/pricing" target="_blank" rel="noopener">공식 가격표</a>를 따릅니다.</p>
  <div class="cards" id="usageCards"></div>
  <div class="chart" id="usageChart" aria-label="최근 14일 일별 요청 수"></div>
  <h2>사용자별 (이번 달)</h2><div class="list" id="usageUsers"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => new Date(t * 1000).toLocaleString('ko-KR');

async function api(path, method = 'GET') {
  const res = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: method === 'POST' ? '{}' : undefined });
  if (res.status === 401 || res.status === 403) { location.href = '/login'; throw new Error('auth'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '요청 실패');
  return data;
}

const KIND = {
  map_load:            { label:'지도 불러오기', short:'지도', limit:10000 },
  place_details:       { label:'장소 정보 (검색해서 추가)', short:'상세', limit:5000 },
  place_details_rich:  { label:'장소 정보 (정보창·평점 포함)', short:'상세+', limit:1000 },
  place_photo:         { label:'장소 사진', short:'사진', limit:1000 },
  geocode:             { label:'주소 변환', short:'주소', limit:10000 },
  route_leg:           { label:'경로 계산 (구간)', short:'경로', limit:10000 },
  autocomplete_select: { label:'검색 후 장소 선택', short:'검색', limit:null },
};
const num = n => Number(n || 0).toLocaleString('ko-KR');

async function loadUsage() {
  try {
    const u = await api('/api/admin/usage');
    $('#usageMonth').textContent = `· ${u.month} (오늘 ${u.today})`;
    $('#usageCards').innerHTML = u.kinds.map(k => {
      const info = KIND[k] || { label:k, limit:null }, m = u.month_counts[k] || 0, t = u.today_counts[k] || 0;
      const pct = info.limit ? Math.round(m / info.limit * 100) : null;
      return `<div class="card"><div class="lb">${esc(info.label)}</div><div class="big">${num(m)}<small style="font-size:12px;font-weight:400;color:var(--muted)"> 이번 달</small></div>
        <div class="sub">오늘 ${num(t)}${info.limit ? ` · 월 무료 한도 약 ${num(info.limit)}건 중 ${pct}%` : ''}</div>
        ${info.limit ? `<div class="bar ${pct >= 100 ? 'over' : pct >= 70 ? 'warn' : ''}"><i style="width:${Math.min(100, pct)}%"></i></div>` : ''}</div>`;
    }).join('');
    const max = Math.max(1, ...u.daily.map(d => d.n));
    $('#usageChart').innerHTML = u.daily.map(d => `<div class="col" title="${d.day}: ${num(d.n)}건"><em>${d.n ? num(d.n) : ''}</em><b style="height:${Math.round(d.n / max * 70)}%"></b><span>${d.day.slice(5)}</span></div>`).join('');
    $('#usageUsers').innerHTML = u.users.length ? u.users.map(x =>
      `<div class="row"><div class="who">${esc(x.email)}<div class="brk">${u.kinds.filter(k => x.counts[k]).map(k => `${KIND[k]?.short || k} ${num(x.counts[k])}`).join(' · ')}</div></div><div class="tot">${num(x.total)}건</div></div>`
    ).join('') : '<div class="empty">아직 기록이 없어요. 사용자가 앱을 쓰면 쌓입니다.</div>';
  } catch (e) { if (e.message !== 'auth') $('#msg').textContent = e.message; }
}
$('#refreshUsage').onclick = loadUsage;

$('#logout').onclick = async () => { await fetch('/api/auth/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); location.href = '/login'; };
loadUsage();
</script>
</body>
</html>
